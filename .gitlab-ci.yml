stages:
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""

services:
  - docker:dind

before_script:
  - docker info

build:
  stage: build
  script:
    - docker build -t scandi-bot .

deploy:
  stage: deploy
  script:
    - docker-compose down || true
    - docker-compose up -d --build
