image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2

stages:
  - cleanup
  - build
  - deploy

cleanup-old-images:
  stage: cleanup
  script:
    - echo "🧹 Удаляем старые образы name_scandi_bot..."
    - docker image prune -f || true
    - docker rmi $(docker images "name_scandi_bot" --format "{{.ID}}" | tail -n +2) || true
  only:
    - main

build-job:
  stage: build
  script:
    - echo "🔧 Собираем новый образ..."
    - docker build -t name_scandi_bot .

deploy-job:
  stage: deploy
  script:
    - echo "🚀 Деплой..."
    - docker-compose down || true
    - docker-compose up -d
